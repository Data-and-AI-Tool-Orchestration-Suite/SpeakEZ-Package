# ============================================================
# EXAMPLE FILE — oral-transcription/clearml.conf
# Copy this file into the oral-transcription folder, rename it
# to "clearml.conf", then replace the CHANGE-ME values.
# ============================================================
api {
    # If your organization runs its own ClearML server, use its
    # addresses instead. For a free clearml.ai account use exactly:
    web_server: https://app.clearml.ai
    api_server: https://api.clearml.ai
    credentials {
        # ClearML website > your profile picture > Settings >
        # API Keys > "Create new secret key" — paste both values here.
        "access_key" = "CHANGE-ME-clearml-access-key"
        "secret_key"  = "CHANGE-ME-clearml-secret-key"
    }
}
sdk {
    aws {
        boto3 {
            multipart_threshold: 9999999999
        },
        s3 {
            credentials: [
                {
                  # The storage server address WITHOUT http:// —
                  # just the IP and port.
                  host: "192.168.1.50:9000"
                  bucket: "speakez-audio"
                  key: "CHANGE-ME-minio-user"
                  secret: "CHANGE-ME-minio-password"
                  multipart: false
                  secure: false
                },
                {
                  host: "192.168.1.50:9000"
                  bucket: "speakez-output"
                  key: "CHANGE-ME-minio-user"
                  secret: "CHANGE-ME-minio-password"
                  multipart: false
                  secure: false
                }
            ]
        }
    }
    development.default_output_uri: "s3://192.168.1.50:9000/speakez-output/"
}
