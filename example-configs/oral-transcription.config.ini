# ============================================================
# EXAMPLE FILE — oral-transcription/config.ini
# Copy this file into the oral-transcription folder, rename it
# to "config.ini", then replace every CHANGE-ME value.
# ============================================================

[API Server]
; Leave as underscore.
api_ip = _
; This is the name of the Redis service inside Docker. Leave as "redis".
docker_ip = redis
; Port the website runs on. Leave as is.
website_port = 8080
; Port this API listens on. Leave as is.
api_port = 5050
; The MD5 "fingerprint" of Key A (see SETUP.md section 2.2).
; For the example key "SpeakEZ-Job-Key-CHANGE-ME-0001" it is:
;   13259adddbc8f5096ff62f551476d8c1
; When you pick your own Key A, generate its fingerprint with:
;   python -c "import hashlib; print(hashlib.md5(b'YOUR-KEY-A').hexdigest())"
api_key_hash = 13259adddbc8f5096ff62f551476d8c1
; Whether the API uses SSL. Leave as false (the website handles that).
http_ssl = false
; The public address of the website (workers report job progress here).
callback_url = https://speakez.example.org
; Key B from SETUP.md section 2.2 (same text as api_key in the
; website's config.php and updates_api_key in the workers' config.ini).
api_key = SpeakEZ-Updates-Key-CHANGE-ME-0002

[S3 Server]
; The storage server from Step 2. Use the server's IP, NOT localhost.
s3_url = http://192.168.1.50:9000
; The same address without any path. Keep in sync with s3_url.
s3_url_no_path = http://192.168.1.50:9000
; A short nickname for the storage connection. Leave as "speakez".
s3_alias = speakez
; The MinIO username and password from Step 2.
s3_user = CHANGE-ME-minio-user
s3_password = CHANGE-ME-minio-password
; The two bucket names created in Step 2.
s3_audio_bucket = speakez-audio
s3_output_bucket = speakez-output

[Local]
; Temporary folder used inside the container. Leave as is.
audio_files = /workspace/audio_files
output_dir = /workspace/output

[LLM]
; An "OpenAI-compatible" AI service used by the summarizing and
; risk-analysis jobs. Ask whoever provides your AI service for the
; address and key. It must end in /v1
openai_api_key = CHANGE-ME-llm-api-key
openai_api_base = https://llm.example.org/v1

[ClearML]
; The ClearML project and queue you create in Step 5.1 of SETUP.md,
; and the name of the template task (leave as is; it is created
; automatically by the seeding scripts).
template_task_name = verbatimizer_template_v4
project_name = SpeakEZ
queue_name = speakez
