# ============================================================
# EXAMPLE FILE — MinIO file storage
# This is the file from Step 5 of SETUP.md. Create a folder
# (e.g. ~/speakez-storage), save this file in it as
# "docker-compose.yml", change the two CHANGE-ME values, then run:
#   docker compose up -d
# ============================================================
services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data:/data
    environment:
      MINIO_ROOT_USER: CHANGE-ME-minio-user
      MINIO_ROOT_PASSWORD: CHANGE-ME-minio-password
    restart: unless-stopped
