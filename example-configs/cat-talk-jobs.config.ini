# ============================================================
# EXAMPLE FILE — cat-talk-jobs/config.ini
# Copy this file into the cat-talk-jobs folder, rename it to
# "config.ini", then replace every CHANGE-ME value.
# ============================================================

[API Server]
; Key A from SETUP.md section 2.2 — the SAME plain text as
; "apiKey" in the website's config.php.
api_key = SpeakEZ-Job-Key-CHANGE-ME-0001
; Key B from SETUP.md section 2.2 — the SAME plain text as
; "api_key" in the website's config.php and "api_key" in the
; job API's config.ini.
updates_api_key = SpeakEZ-Updates-Key-CHANGE-ME-0002
; The public address of the website (both lines the same).
callback_url = https://speakez.example.org
callback_url_2 = https://speakez.example.org

[S3 Server]
; The storage server from Step 2. Use the server's IP, NOT localhost.
s3_address = 192.168.1.50
s3_port = 9000
s3_top_level_bucket =
s3_audio_bucket = speakez-audio
s3_output_bucket = speakez-output

[LLM]
; The same AI service address and key as in the job API's config.ini.
openai_api_key = CHANGE-ME-llm-api-key
openai_api_base = https://llm.example.org/v1

; The AI model the analysis jobs use. Ask whoever provides your AI
; service which model name to put here.
[Model]
large_model = google/gemma-4-31B-it

; Which jobs THIS machine runs (comma-separated, no spaces needed).
; GPU machine: verbatimizer, synchronizer
; CPU machine:  custom, riskalyzer, describalizer, ohmsifier
[Jobs]
job_types = verbatimizer, synchronizer
max_workers = 4

; HuggingFace token — the same one from the .env file.
[HuggingFace]
auth_token = hf_CHANGE-ME-your-huggingface-token
