services:
  php:
    container_name: ${PROJECT_NAME}_php
    build:
      context: './backend/php'
      args:
        MC_ALIAS: ${MC_ALIAS}
        MC_URL: ${MC_URL}
        MC_USER: ${MC_USER}
        MC_PASSWORD: ${MC_PASSWORD}
    environment:
      - MC_ALIAS=${MC_ALIAS}
      - MC_URL=${MC_URL}
      - MC_USER=${MC_USER}
      - MC_PASSWORD=${MC_PASSWORD}

    networks:
      - backend
    restart: unless-stopped
    volumes:
      - ./frontend/:/var/www/html/
      - ./frontend/css/:/var/www/html/${ROOT_URL}/css/
      - ./frontend/img/:/var/www/html/${ROOT_URL}/img/
      - ./frontend/js/:/var/www/html/${ROOT_URL}/js/
    
  apache:
    container_name: ${PROJECT_NAME}_apache
    build: './backend/apache'
    depends_on:
      - php
      - postgres
    networks:
      - frontend
      - backend
    ports:
      - "${APACHE_PORT}:80"
    restart: unless-stopped
    volumes:
      - ./frontend/:/var/www/html/
      - ./frontend/css/:/var/www/html/${ROOT_URL}/css/
      - ./frontend/img/:/var/www/html/${ROOT_URL}/img/
      - ./frontend/js/:/var/www/html/${ROOT_URL}/js/

  postgres:
    container_name: ${PROJECT_NAME}_postgres
    build: 
      context: './backend/postgres'
      args:
        ADMIN_EPPN: ${ADMIN_EPPN}
    environment:
      TZ: 'GMT'
      PGTZ: 'GMT'
    networks:
      - backend
    env_file: ".env"
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: unless-stopped
    volumes: 
      - oralhist-data:/var/lib/postgresql/data

networks:
  frontend:
  backend:
volumes:
  oralhist-data: # CHANGE THIS FOR YOUR PROJECT NAME. CANNOT BE ADJUSTED BY ENV VARS
