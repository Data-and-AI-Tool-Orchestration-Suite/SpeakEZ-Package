; prod.ini — error display for a deployed site.
; PHP notices and deprecations (often from third-party libraries) must never
; be printed into the page: any output sent before a redirect header breaks
; the redirect ("Cannot modify header information - headers already sent" —
; this broke the login flow when a library logged a PHP 8.4+ deprecation).
; Errors are still recorded: log_errors sends them to the FPM workers'
; stderr, and catch_workers_output in www.conf forwards that to
; "docker logs".
display_errors = Off
display_startup_errors = Off
log_errors = On
